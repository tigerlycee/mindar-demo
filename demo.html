<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindAR Demo</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    .a-canvas { background: transparent !important; }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75); z-index: 1000;
    }
    #start-btn {
      padding: 16px 36px; font-size: 20px;
      background: #4caf50; color: #fff;
      border: none; border-radius: 10px; cursor: pointer;
    }
    #start-btn:disabled { background: #888; }
    #info {
      position: fixed; top: 12px; left: 0; right: 0;
      text-align: center; color: #fff;
      font-family: sans-serif; font-size: 14px;
      text-shadow: 0 0 4px #000; z-index: 999; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <button id="start-btn">AR を開始する</button>
  </div>
  <div id="info">マーカーにカメラを向けてください</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;
      uiLoading: yes; uiError: yes; uiScanning: yes;
      filterMinCF: 0.001; filterBeta: 10000; missTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <img id="chara"  src="./butter_512.png">
      <img id="smoke1" src="./smoke_1.png">
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- スモーク用コンテナ（ボブと独立） -->
      <a-entity id="smoke-container" position="0 0 0.002"></a-entity>
      <!-- 待機ボブ: このエンティティの Y で制御 -->
      <a-entity id="chara-root" position="0 0 0.001">
        <!-- ジャンプ・出現スケール: このエンティティで制御 -->
        <a-image id="chara-plane" src="#chara"
          position="0 0 0" width="0.8" height="0.8"
          transparent="true" scale="0 0 0">
        </a-image>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl       = document.querySelector('a-scene');
    const overlay       = document.querySelector('#overlay');
    const startBtn      = document.querySelector('#start-btn');
    const info          = document.querySelector('#info');
    const target        = document.querySelector('#target');
    const smokeContainer= document.querySelector('#smoke-container');
    const root          = document.querySelector('#chara-root');
    const plane         = document.querySelector('#chara-plane');

    // ---- AR 起動 ----
    startBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      startBtn.disabled = true;
      startBtn.textContent = '読み込み中...';
      try {
        if (!sceneEl.hasLoaded) {
          await new Promise(r => sceneEl.addEventListener('loaded', r, { once: true }));
        }
        await sceneEl.systems['mindar-image-system'].start();
        overlay.style.display = 'none';
      } catch (err) {
        startBtn.textContent = 'エラー — 再読み込みしてください';
        startBtn.disabled = false;
      }
    });

    // ---- イージング ----
    function easeOutBack(x) {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    // ---- スモーク（smoke_1 のみ）----
    // expand(0.18s) → 透明度0で保持(0.7s) → fade out(0.6s)
    function spawnSmoke() {
      const img = document.createElement('a-image');
      img.setAttribute('src', '#smoke1');
      img.setAttribute('width', '2.6');
      img.setAttribute('height', '0.8');
      img.setAttribute('material', 'transparent: true; alphaTest: 0.05; shader: flat; opacity: 0.9');
      img.object3D.position.set(0, -0.1, 0.001);
      img.object3D.scale.set(0.05, 0.05, 1);
      smokeContainer.appendChild(img);

      let t = 0;
      const expandDur = 0.18;
      const holdDur   = 0.70;
      const fadeDur   = 0.60;
      const total     = expandDur + holdDur + fadeDur;

      const id = setInterval(() => {
        t += 0.016;
        if (t <= expandDur) {
          const n = t / expandDur;
          img.object3D.scale.set(0.05 + 0.95 * n, 0.05 + 0.95 * n, 1);
        } else if (t <= expandDur + holdDur) {
          // 不透明のまま保持
        } else {
          const n = (t - expandDur - holdDur) / fadeDur;
          img.object3D.position.y = -0.1 + 0.2 * n;
          const mesh = img.getObject3D('mesh');
          if (mesh) { mesh.material.opacity = 0.9 * (1 - n); mesh.material.needsUpdate = true; }
        }
        if (t >= total) {
          clearInterval(id);
          if (img.parentNode) img.parentNode.removeChild(img);
        }
      }, 16);
    }

    // ---- 待機ボブ（chara-root の Y） ----
    let idleTimer = null, idlePhase = 0;

    function startIdle() {
      stopIdle();
      idlePhase = 0;
      idleTimer = setInterval(() => {
        idlePhase += 0.016 / 1.5 * Math.PI * 2;
        root.object3D.position.y = Math.sin(idlePhase) * 0.015;
      }, 16);
    }

    function stopIdle() {
      if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
      root.object3D.position.y = 0;
    }

    // ---- 登場: スモーク保持(0.88s) → スモークが晴れはじめたらキャラ出現 ----
    function playAppear() {
      plane.object3D.scale.set(0.001, 0.001, 0.001);
      spawnSmoke();
      setTimeout(() => {
        let t = 0;
        const id = setInterval(() => {
          t = Math.min(t + 0.016, 0.5);
          const s = easeOutBack(t / 0.5);
          plane.object3D.scale.set(s, s, s);
          if (t >= 0.5) { clearInterval(id); startIdle(); }
        }, 16);
      }, 180); // expand終了と同時
    }

    // ---- 消える: スモーク展開 → ピーク時にキャラ消去 → スモーク晴れる ----
    function playDisappear() {
      stopIdle();
      spawnSmoke(); // スモーク先行
      // スモークがピーク（150ms）でキャラを素早く消す
      setTimeout(() => {
        let t = 0;
        const id = setInterval(() => {
          t = Math.min(t + 0.016, 0.12);
          plane.object3D.scale.set(1 - t / 0.12, 1 - t / 0.12, 1 - t / 0.12);
          if (t >= 0.12) clearInterval(id);
        }, 16);
      }, 150);
      // スモークはその後 700ms かけて自然に晴れる
    }

    // ---- ジャンプ（chara-plane の Y） ----
    let jumping = false, isTracking = false;

    function triggerJump() {
      if (!isTracking || jumping) return;
      jumping = true;
      let t = 0;
      const id = setInterval(() => {
        t = Math.min(t + 0.016, 0.7);
        const n = t / 0.7;
        plane.object3D.position.y = 0.3 * 4 * n * (1 - n);
        if (t >= 0.7) {
          plane.object3D.position.y = 0;
          clearInterval(id);
          jumping = false;
        }
      }, 16);
    }

    // ---- マーカーイベント ----
    target.addEventListener('targetFound', () => {
      info.textContent = '認識OK — タップでジャンプ';
      isTracking = true;
      playAppear();
    });
    target.addEventListener('targetLost', () => {
      info.textContent = 'マーカーを探しています...';
      isTracking = false;
      jumping = false;
      playDisappear();
    });

    document.addEventListener('click', triggerJump);
    document.addEventListener('touchstart', triggerJump, { passive: true });
  </script>
</body>
</html>
