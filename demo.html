<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindAR Demo</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; }
    .a-canvas { background: transparent !important; }
    #overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75); z-index: 1000;
    }
    #start-btn {
      padding: 16px 36px; font-size: 20px;
      background: #4caf50; color: #fff;
      border: none; border-radius: 10px; cursor: pointer;
    }
    #start-btn:disabled { background: #888; }
    #info {
      position: fixed; top: 12px; left: 0; right: 0;
      text-align: center; color: #fff;
      font-family: sans-serif; font-size: 14px;
      text-shadow: 0 0 4px #000; z-index: 999; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <button id="start-btn">AR を開始する</button>
  </div>
  <div id="info">マーカーにカメラを向けてください</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false;
      uiLoading: yes; uiError: yes; uiScanning: yes;
      filterMinCF: 0.001; filterBeta: 10000; missTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <img id="chara" src="./butter_512.png">
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- スモーク用コンテナ（ボブと独立） -->
      <a-entity id="smoke-container" position="0 0 0.002"></a-entity>
      <!-- 待機ボブ: このエンティティの Y で制御 -->
      <a-entity id="chara-root" position="0 0 0.001">
        <!-- ジャンプ・出現スケール: このエンティティで制御 -->
        <a-image id="chara-plane" src="#chara"
          position="0 0 0" width="0.8" height="0.8"
          transparent="true" scale="0 0 0">
        </a-image>
      </a-entity>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl       = document.querySelector('a-scene');
    const overlay       = document.querySelector('#overlay');
    const startBtn      = document.querySelector('#start-btn');
    const info          = document.querySelector('#info');
    const target        = document.querySelector('#target');
    const smokeContainer= document.querySelector('#smoke-container');
    const root          = document.querySelector('#chara-root');
    const plane         = document.querySelector('#chara-plane');

    // ---- AR 起動 ----
    startBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      startBtn.disabled = true;
      startBtn.textContent = '読み込み中...';
      try {
        if (!sceneEl.hasLoaded) {
          await new Promise(r => sceneEl.addEventListener('loaded', r, { once: true }));
        }
        await sceneEl.systems['mindar-image-system'].start();
        overlay.style.display = 'none';
      } catch (err) {
        startBtn.textContent = 'エラー — 再読み込みしてください';
        startBtn.disabled = false;
      }
    });

    // ---- イージング ----
    function easeOutBack(x) {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
    }

    // ---- パーティクル（登場時：カラフルな丸が飛び散る）----
    function spawnParticles() {
      const colors = ['#FFD700', '#FF69B4', '#FF4500', '#00CED1', '#FF1493', '#7B68EE', '#FFD700', '#FF69B4', '#FF4500', '#00CED1'];
      const count = 10;
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
        const speed = 0.35 + Math.random() * 0.25;
        const radius = 0.03 + Math.random() * 0.03;
        const p = document.createElement('a-circle');
        p.setAttribute('material', `color: ${colors[i % colors.length]}; transparent: true; opacity: 1; shader: flat`);
        p.setAttribute('radius', String(radius));
        p.object3D.position.set(0, -0.3, 0.004);
        smokeContainer.appendChild(p);
        setTimeout(() => {
          let t = 0;
          const dur = 0.5 + Math.random() * 0.2;
          const id = setInterval(() => {
            t += 0.016;
            const n = Math.min(t / dur, 1);
            p.object3D.position.set(
              Math.cos(angle) * speed * n,
              -0.3 + Math.sin(angle) * speed * n + 0.1 * n,
              0.004
            );
            const mesh = p.getObject3D('mesh');
            if (mesh) { mesh.material.opacity = Math.max(0, 1 - n * n * 1.5); mesh.material.needsUpdate = true; }
            if (t >= dur) { clearInterval(id); if (p.parentNode) p.parentNode.removeChild(p); }
          }, 16);
        }, i * 15);
      }
    }

    // ---- 待機ボブ（chara-root の Y） ----
    let idleTimer = null, idlePhase = 0;

    function startIdle() {
      stopIdle();
      idlePhase = 0;
      idleTimer = setInterval(() => {
        idlePhase += 0.016 / 1.5 * Math.PI * 2;
        root.object3D.position.y = Math.sin(idlePhase) * 0.015;
      }, 16);
    }

    function stopIdle() {
      if (idleTimer) { clearInterval(idleTimer); idleTimer = null; }
      root.object3D.position.y = 0;
    }

    // ---- 登場: 足元(y=-0.4)からスケールアップ + パーティクル ----
    function playAppear() {
      plane.object3D.scale.set(0.001, 0.001, 0.001);
      plane.object3D.position.y = -0.4;
      const mesh = plane.getObject3D('mesh');
      if (mesh) { mesh.material.color.setRGB(1, 1, 1); mesh.material.needsUpdate = true; }
      spawnParticles();
      let t = 0;
      const id = setInterval(() => {
        t = Math.min(t + 0.016, 0.5);
        const n = t / 0.5;
        const s = easeOutBack(n);
        plane.object3D.scale.set(s, s, s);
        plane.object3D.position.y = (n - 1) * 0.4; // 足元固定で上に伸びる
        if (t >= 0.5) { plane.object3D.position.y = 0; clearInterval(id); startIdle(); }
      }, 16);
    }

    // ---- 消える: じわっと暗転 → ほぼ黒でパッと消える ----
    function playDisappear() {
      stopIdle();
      let t = 0;
      const darkDur = 0.7;
      const id = setInterval(() => {
        t += 0.016;
        const n = Math.min(t / darkDur, 1);
        const b = 1 - n;
        const mesh = plane.getObject3D('mesh');
        if (mesh) { mesh.material.color.setRGB(b, b, b); mesh.material.needsUpdate = true; }
        if (n >= 1) {
          clearInterval(id);
          plane.object3D.scale.set(0, 0, 0);
          const mesh2 = plane.getObject3D('mesh');
          if (mesh2) { mesh2.material.color.setRGB(1, 1, 1); mesh2.material.needsUpdate = true; }
        }
      }, 16);
    }

    // ---- ジャンプ（chara-plane の Y） ----
    let jumping = false, isTracking = false;

    function triggerJump() {
      if (!isTracking || jumping) return;
      jumping = true;
      let t = 0;
      const id = setInterval(() => {
        t = Math.min(t + 0.016, 0.7);
        const n = t / 0.7;
        plane.object3D.position.y = 0.3 * 4 * n * (1 - n);
        if (t >= 0.7) {
          plane.object3D.position.y = 0;
          clearInterval(id);
          jumping = false;
        }
      }, 16);
    }

    // ---- マーカーイベント ----
    target.addEventListener('targetFound', () => {
      info.textContent = '認識OK — タップでジャンプ';
      isTracking = true;
      playAppear();
    });
    target.addEventListener('targetLost', () => {
      info.textContent = 'マーカーを探しています...';
      isTracking = false;
      jumping = false;
      playDisappear();
    });

    document.addEventListener('click', triggerJump);
    document.addEventListener('touchstart', triggerJump, { passive: true });
  </script>
</body>
</html>
