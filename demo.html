<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindAR Demo</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    a-scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; }

    #overlay {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.75);
      z-index: 1000;
    }
    #start-btn {
      padding: 16px 36px; font-size: 20px;
      background: #4caf50; color: #fff;
      border: none; border-radius: 10px; cursor: pointer;
    }
    #start-btn:disabled { background: #888; }
    #info {
      position: fixed; top: 12px; left: 0; right: 0;
      text-align: center; color: #fff;
      font-family: sans-serif; font-size: 14px;
      text-shadow: 0 0 4px #000;
      z-index: 999; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <button id="start-btn">AR を開始する</button>
  </div>
  <div id="info">マーカーにカメラを向けてください</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiError: yes; uiScanning: yes;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true; alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <img id="chara" src="./butter_512.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-image id="chara-plane" src="#chara"
        position="0 0 0.001"
        width="0.8" height="0.8"
        transparent="true">
      </a-image>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl  = document.querySelector('a-scene');
    const overlay  = document.querySelector('#overlay');
    const startBtn = document.querySelector('#start-btn');
    const info     = document.querySelector('#info');

    startBtn.addEventListener('click', async () => {
      startBtn.disabled = true;
      startBtn.textContent = '読み込み中...';

      try {
        if (!sceneEl.hasLoaded) {
          await new Promise(resolve => sceneEl.addEventListener('loaded', resolve, { once: true }));
        }
        await sceneEl.systems['mindar-image-system'].start();
        overlay.style.display = 'none';
      } catch (e) {
        startBtn.textContent = 'エラー — 再読み込みしてください';
        startBtn.disabled = false;
        console.error(e);
      }
    });

    const target = document.querySelector('#target');
    const plane  = document.querySelector('#chara-plane');
    let isTracking = false;
    let jumping    = false;

    target.addEventListener('targetFound', () => {
      info.textContent = '認識OK — タップでジャンプ';
      isTracking = true;
    });
    target.addEventListener('targetLost', () => {
      info.textContent = 'マーカーを探しています...';
      isTracking = false;
    });

    // A-Frame の click はカーソルが必要なので document レベルで取る
    document.addEventListener('click', triggerJump);
    document.addEventListener('touchstart', triggerJump, { passive: true });

    function triggerJump() {
      if (!isTracking || jumping) return;
      jumping = true;
      let t = 0;
      const id = setInterval(() => {
        t += 0.016;
        const n = t / 0.7;
        if (n >= 1) {
          plane.setAttribute('position', '0 0.001 0.001');
          clearInterval(id);
          jumping = false;
          return;
        }
        const h = 0.3 * 4 * n * (1 - n);
        plane.setAttribute('position', `0 ${h + 0.001} 0.001`);
      }, 16);
    }
  </script>
</body>
</html>
