<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindAR Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    #start-btn {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      padding: 16px 36px; font-size: 20px;
      background: #4caf50; color: #fff;
      border: none; border-radius: 10px;
      cursor: pointer; z-index: 1000;
    }
    #info {
      display: none;
      position: fixed; top: 12px; left: 0; right: 0;
      text-align: center; color: #fff;
      font-family: sans-serif; font-size: 14px;
      text-shadow: 0 0 4px #000;
      z-index: 999; pointer-events: none;
    }
  </style>
</head>
<body>
  <button id="start-btn">AR を開始する</button>
  <div id="info">マーカーにカメラを向けてください</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; uiLoading: yes; uiError: yes; uiScanning: yes;"
    color-space="sRGB"
    embedded
    renderer="colorManagement: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <img id="chara" src="./butter_512.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-image id="chara-plane" src="#chara"
        position="0 0 0.001"
        width="0.6" height="1.0"
        transparent="true">
      </a-image>
    </a-entity>
  </a-scene>

  <script>
    const sceneEl  = document.querySelector('a-scene');
    const startBtn = document.querySelector('#start-btn');
    const info     = document.querySelector('#info');

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      info.style.display = 'block';
      sceneEl.systems['mindar-image-system'].start();
    });

    const target = document.querySelector('#target');
    target.addEventListener('targetFound', () => {
      info.textContent = '認識OK — タップでジャンプ';
    });
    target.addEventListener('targetLost', () => {
      info.textContent = 'マーカーを探しています...';
    });

    // タップでジャンプ（放物線）
    const plane = document.querySelector('#chara-plane');
    let jumping = false;
    plane.addEventListener('click', () => {
      if (jumping) return;
      jumping = true;
      let t = 0;
      const id = setInterval(() => {
        t += 0.016;
        const n = t / 0.7;
        if (n >= 1) {
          plane.setAttribute('position', '0 0.001 0.001');
          clearInterval(id);
          jumping = false;
          return;
        }
        const h = 0.3 * 4 * n * (1 - n);
        plane.setAttribute('position', `0 ${h + 0.001} 0.001`);
      }, 16);
    });
  </script>
</body>
</html>
